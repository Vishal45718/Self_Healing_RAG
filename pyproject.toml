[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-rag"
version = "0.1.0"
description = "Self-Healing RAG with corrective retrieval, critique, and query reformulation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jon Snow" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2",
    "huggingface_hub>=0.20.0",
    "langgraph>=0.0.1",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as external integration tests",
]
