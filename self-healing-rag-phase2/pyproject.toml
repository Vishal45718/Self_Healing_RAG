[project]
name = "self-healing-rag"
version = "0.1.0"
description = "A self-healing RAG system with critic-driven retry via LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.1,<2.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "huggingface_hub>=0.25",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
